apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Push so entra no build quando as credenciais do Firebase estao presentes.
 *
 * Aplicar o plugin sem `google-services.json` faz o build FALHAR, e o arquivo
 * nao esta no repositorio: ele identifica o projeto do Firebase, e este
 * repositorio e publico. Condicionar aqui mantem o aplicativo compilando sem
 * push — que e exatamente o estado de quem clona o projeto pela primeira vez —
 * e liga o push assim que alguem coloca o arquivo em android/app/.
 */
def googleServicesFile = file("google-services.json")
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("AVISO: android/app/google-services.json nao encontrado. O aplicativo sera compilado SEM push — as ofertas so chegarao com ele aberto.")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Portao P0.3 — versao unica.
 *
 * O `versionName` vem do `package.json` do driver-app, o mesmo arquivo que o
 * bundle JavaScript le via `app.env.js`. Antes as duas informacoes divergiam
 * (`0.0.1` no JS contra `1.0` aqui), o que impede saber qual build um motoboy
 * esta rodando ao dar suporte.
 */
def driverAppPackageJson = new groovy.json.JsonSlurper().parse(file("../../package.json"))
def resolvedVersionName = driverAppPackageJson.version

/**
 * `versionCode` e sempre explicito: precisa ser um inteiro crescente e nunca
 * reaproveitado, inclusive num rollback. O padrao 1 serve apenas para builds
 * de debug locais; um release exige o valor no comando (ver a checagem em
 * `gradle.taskGraph.whenReady`, mais abaixo).
 */
def resolvedVersionCode = Integer.parseInt(
    (project.findProperty("motoboycity.versionCode")
        ?: System.getenv("MOTOBOYCITY_VERSION_CODE")
        ?: "1").toString()
)

/**
 * Assinatura do release: caminho e senhas vem do ambiente, nunca do
 * repositorio. Ver a checagem obrigatoria em `gradle.taskGraph.whenReady`.
 */
def releaseKeystorePath = System.getenv("MOTOBOYCITY_KEYSTORE_FILE")

/**
 * HTTP local so e permitido no artefato de desenvolvimento. O Manifest usa
 * este placeholder; sem defini-lo o merge do Android falha antes de compilar.
 */
def driverAppEnvironment = (System.getenv("MOTOBOYCITY_APP_ENV") ?: "development").toString()
def allowCleartextTraffic = driverAppEnvironment == "development"

/**
 * Chave do Google Maps para Android.
 *
 * Vem de `android/local.properties`, que NAO vai para o Git — o repositorio e
 * publico. Em maquina de build (CI, por exemplo) ela pode vir da variavel de
 * ambiente MAPS_API_KEY no lugar.
 *
 * Ficar vazia nao quebra o build: o app compila e o mapa aparece cinza. Isso e
 * proposital, para quem clona o projeto conseguir rodar antes de ter a chave.
 */
def mapsApiKey = ""
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    def localProperties = new Properties()
    localPropertiesFile.withInputStream { localProperties.load(it) }
    mapsApiKey = (localProperties.getProperty("MAPS_API_KEY") ?: "").trim()
}
if (!mapsApiKey) {
    mapsApiKey = (System.getenv("MAPS_API_KEY") ?: "").trim()
}
if (!mapsApiKey) {
    logger.warn("MAPS_API_KEY ausente: o mapa do aplicativo vai aparecer em branco.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.motoboycity.driverapp"
    defaultConfig {
        applicationId "com.motoboycity.driverapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        manifestPlaceholders = [
            usesCleartextTraffic: allowCleartextTraffic.toString(),
            mapsApiKey: mapsApiKey,
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Configurado somente quando o ambiente fornece a chave. Sem ela o
            // build de release falha na checagem abaixo, em vez de cair
            // silenciosamente na chave de debug.
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("MOTOBOYCITY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOTOBOYCITY_KEY_ALIAS")
                keyPassword System.getenv("MOTOBOYCITY_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

/**
 * Portao P0.3 — um APK de release nao pode sair daqui assinado com a chave de
 * debug: ela e publica e conhecida, e o Android so aceita atualizar um app se
 * a assinatura for a mesma, entao publicar com a chave de debug inviabiliza
 * qualquer atualizacao futura.
 *
 * A checagem roda no grafo de tarefas para nao atrapalhar builds de debug.
 */
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i).*(assemble|bundle|install)release.*/
    }

    if (!buildingRelease) {
        return
    }

    def missing = [
        "MOTOBOYCITY_KEYSTORE_FILE",
        "MOTOBOYCITY_KEYSTORE_PASSWORD",
        "MOTOBOYCITY_KEY_ALIAS",
        "MOTOBOYCITY_KEY_PASSWORD",
    ].findAll { !System.getenv(it) }

    if (missing) {
        throw new GradleException(
            "Build de release sem chave de assinatura. Defina no ambiente: ${missing.join(', ')}. " +
            "A chave fica FORA do repositorio e as senhas nunca sao versionadas. " +
            "Ver docs/go-live-pilot-runbook.md, portao P0.3."
        )
    }

    if (!file(releaseKeystorePath).exists()) {
        throw new GradleException(
            "MOTOBOYCITY_KEYSTORE_FILE aponta para um arquivo inexistente: ${releaseKeystorePath}"
        )
    }

    if (!project.findProperty("motoboycity.versionCode") && !System.getenv("MOTOBOYCITY_VERSION_CODE")) {
        throw new GradleException(
            "Build de release sem versionCode explicito. Defina MOTOBOYCITY_VERSION_CODE " +
            "com um inteiro maior que o do ultimo APK publicado — inclusive num rollback, " +
            "porque o Android recusa reinstalar um versionCode ja usado."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // NotificationCompat, usado pelo OfferMessagingService. Ja vem transitivo do
    // React Native; declarado aqui para a dependencia ser explicita onde e usada.
    implementation("androidx.core:core-ktx:1.13.1")
    // OkHttp para os botoes da notificacao responderem a oferta: o
    // `HttpURLConnection` do Android recusa o metodo PATCH. Ja vem transitivo do
    // React Native; declarado aqui para a dependencia ser explicita onde e usada.
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    /**
     * Firebase Messaging no classpath do PROPRIO modulo do aplicativo.
     *
     * O pacote @react-native-firebase/messaging traz a biblioteca para o modulo
     * DELE, nao para este — e o `OfferMessagingService` daqui precisa herdar de
     * `FirebaseMessagingService` para montar a notificacao de tela cheia com os
     * botoes.
     *
     * A versao vem do BOM, e o BOM e exatamente o que o react-native-firebase
     * usa (declarado no package.json dele). Fixar outra versao aqui criaria duas
     * versoes do Firebase no mesmo APK.
     */
    implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
    implementation("com.google.firebase:firebase-messaging")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
