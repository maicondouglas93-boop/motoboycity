# =============================================================================
# MOTOboyCity — infraestrutura da API no Render
#
# O Render le este arquivo do repositorio e cria os servicos sozinho (Blueprint).
# Os dois paineis web NAO estao aqui: eles vao para a Vercel.
#
# COMO USAR
#   1. Render > New > Blueprint > aponte para este repositorio.
#   2. Ele cria Redis e a API. O PostgreSQL fica no Neon.
#   3. Preencha DATABASE_URL com a URL pooled do Neon e DIRECT_URL com a URL
#      direta do mesmo banco. REDIS_URL e ligado automaticamente pelo Render.
#   4. Tudo marcado `sync: false` aparece em branco para voce preencher no
#      painel. Sao os segredos — nenhum deles pode morar neste arquivo, porque
#      o repositorio e PUBLICO.
#
# ANTES DO PRIMEIRO DEPLOY, sem falta:
#   - Preencher CORS_ORIGINS com os dominios da Vercel. Sem isso os paineis
#     carregam e TODA chamada e bloqueada pelo navegador.
#   - Preencher ADMIN_SEED_EMAIL e ADMIN_SEED_PASSWORD com credenciais fortes.
#     O `initialDeployHook` cria a regiao inicial e o primeiro administrador
#     uma unica vez pelo fluxo reproduzivel do Blueprint.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis — filas do BullMQ (despacho, repasse financeiro).
  #
  # `noeviction` NAO e detalhe de performance: o BullMQ guarda o estado dos jobs
  # no Redis, e uma politica que descarta chave por falta de memoria faria uma
  # oferta de entrega simplesmente sumir. O proprio BullMQ recusa iniciar com
  # outra politica.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: motoboycity-redis
    plan: starter
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ---------------------------------------------------------------------------
  # A API (NestJS).
  # ---------------------------------------------------------------------------
  - type: web
    name: motoboycity-api
    runtime: node
    plan: starter
    region: virginia
    branch: main
    # Monorepo pnpm: o build roda da RAIZ, porque as dependencias sao do
    # workspace inteiro e a API importa @motoboycity/types e /validation.
    rootDir: .
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @motoboycity/validation build &&
      corepack pnpm --filter @motoboycity/api exec prisma generate &&
      corepack pnpm --filter @motoboycity/api exec prisma migrate deploy &&
      corepack pnpm --filter @motoboycity/api build
    # Delega ao script do proprio pacote (`node dist/main`), em vez de repetir
    # o caminho aqui: se o build mudar de lugar, o start acompanha sozinho.
    startCommand: corepack pnpm --filter @motoboycity/api start:prod
    # Este hook oficial do Render executa somente depois do primeiro deploy
    # bem-sucedido e torna o bootstrap reproduzivel sem colocar credenciais no
    # repositorio.
    initialDeployHook: corepack pnpm --filter @motoboycity/api exec prisma db seed
    healthCheckPath: /health

    envVars:
      # --- Neon (PostgreSQL externo) -----------------------------------------
      # DATABASE_URL: conexao pooled, usada pela API em runtime.
      # DIRECT_URL: conexao direta, usada pelo Prisma Migrate durante o build.
      # O Render solicita os valores na criacao inicial do Blueprint. Se o
      # Blueprint ja existir, preencha as duas manualmente no painel.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- ligado automaticamente pelo Render --------------------------------
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: motoboycity-redis
          property: connectionString

      # --- obrigatorios ------------------------------------------------------

      # A API NAO SOBE sem isto: o modulo de autenticacao usa `getOrThrow`.
      # Deixe o Render gerar — assim o valor nunca passa por lugar nenhum.
      - key: JWT_SECRET
        generateValue: true

      # Dominios dos dois paineis na Vercel, separados por virgula e SEM barra
      # no final. Vazio faz a API cair para localhost, e o navegador bloqueia
      # tudo em producao.
      # Ex.: https://admin.seudominio.com,https://loja.seudominio.com
      - key: CORS_ORIGINS
        sync: false

      - key: NODE_ENV
        value: production
      # A faixa aberta `>=20` do package.json fez o Render escolher Node 26.
      # Fixamos a mesma versao exercitada pelo CI e pelo desenvolvimento local.
      - key: NODE_VERSION
        value: '22.18.0'

      # --- ajustes com padrao seguro ----------------------------------------

      # Limite de requisicoes por janela. Os valores abaixo sao os mesmos do
      # desenvolvimento; ajuste depois de ver trafego real.
      - key: THROTTLE_LIMIT
        value: '120'
      - key: THROTTLE_TTL_MS
        value: '60000'
      # Observabilidade de baixa cardinalidade; nao altera respostas nem cacheia
      # dados. Registra apenas operacoes lentas e falhas 5xx.
      - key: SLOW_REQUEST_THRESHOLD_MS
        value: '750'

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT_MS
        value: '30000'

      # OAuth aiqfome / ID Magalu. Os segredos sao preenchidos somente no
      # painel; redirect e retorno da Company Web permanecem publicos e fixos.
      - key: AIQFOME_CLIENT_ID
        sync: false
      - key: AIQFOME_CLIENT_SECRET
        sync: false
      - key: AIQFOME_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: AIQFOME_REDIRECT_URI
        value: https://motoboycity-api.onrender.com/integrations/aiqfome/callback
      - key: COMPANY_WEB_URL
        value: https://motoboycity-company-web.vercel.app

      # --- segredos: preencher no painel do Render --------------------------
      #
      # Cada um destes desliga uma parte do produto se ficar vazio. Nenhum
      # impede a API de subir, exceto onde anotado.

      # Geocodificacao no servidor. Sem ela, pedido com endereco informado nao
      # ganha coordenada — e a trava de "so finaliza perto do destino" para de
      # valer, em silencio.
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Secretaria Virtual. Sem ela, a tela responde erro.
      - key: GROQ_API_KEY
        sync: false

      # Notificacao de oferta no celular do motoboy. Sem isso, ele so ve a
      # oferta se estiver com o aplicativo aberto na tela.
      #
      # FIREBASE_PRIVATE_KEY e uma chave privada de verdade. Cole no painel do
      # Render, com as quebras de linha como `\n`, e em lugar nenhum mais.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # Foto de perfil. Hoje so a chave privada e lida pelo servidor; as outras
      # tres estao no `.env.example` e entram quando o envio pelo painel
      # precisar delas.
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_ID
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false

      # Administrador criado pelo `prisma db seed`, na primeira vez.
      # Escolha uma senha forte: e o acesso ao painel inteiro.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
